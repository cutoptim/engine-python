[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cutoptim"
version = "1.1.0"
description = "Official client for the CutOptim Engine API — cutting optimization (2D panels, 1D linear, timber, true-shape nesting) over HTTPS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "CutOptim", email = "support@cutoptim.com" }]
keywords = ["cutoptim", "cutting optimization", "cut list", "nesting", "panel saw", "api client"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://cutoptim.com/engine/reference"
Source = "https://github.com/cutoptim/engine-python"
Issues = "https://github.com/cutoptim/engine-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["cutoptim"]
